<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0714">
<title>Мой список · что посмотреть</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg: #0b0714;
    --bg-img: radial-gradient(1100px 600px at 8% -10%, rgba(120,50,180,.42), transparent 70%),
              radial-gradient(900px 520px at 102% 0%, rgba(200,50,120,.32), transparent 70%),
              radial-gradient(900px 700px at 50% 125%, rgba(30,60,160,.3), transparent 70%);
    --card: rgba(255,255,255,.055);
    --border: rgba(255,255,255,.1);
    --text: #efe8ff;
    --muted: #a596c4;
    --pink: #ff5fa2;
    --violet: #a855f7;
    --gold: #ffd166;
    --shadow-color: rgba(255,95,162,.85);
  }
  
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    min-height: var(--tg-viewport-stable-height, 100vh);
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(80px + env(safe-area-inset-bottom, 0px));
    color:var(--text);
    background-color:var(--bg);
    background-image:var(--bg-img);
    background-attachment: scroll;
    -webkit-font-smoothing:antialiased;
    transition: background-color .3s, color .3s;
  }
  .wrap{max-width:1200px;margin:0 auto}

  .top{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;margin-bottom:20px}
  .brand h1{
    font-size:clamp(24px,4.6vw,40px);font-weight:800;letter-spacing:-.6px;line-height:1.1;
    background:linear-gradient(120deg,#ff8ac2,#c084fc 45%,#7dd3fc);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .brand h1 span{-webkit-text-fill-color:var(--gold)}
  .sub{margin-top:7px;font-size:13px;color:var(--muted)}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end;min-width:280px}
  .search{
    display:flex;align-items:center;gap:8px;flex:1;min-width:160px;max-width:280px;
    padding:0 14px;border-radius:14px;
    border:1px solid var(--border);background:var(--card);
    transition:.2s;
  }
  .search:focus-within{border-color:var(--pink);box-shadow:0 0 0 3px var(--shadow-color)}
  .search span{opacity:.6;font-size:14px}
  .search input{
    flex:1;background:none;border:none;outline:none;color:var(--text);
    font-family:inherit;font-size:14px;padding:12px 0;
  }
  .search input::placeholder{color:var(--muted)}

  .btn{
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    padding:12px 16px;border-radius:14px;border:none;transition:.2s;white-space:nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-main{
    color:#fff;background:linear-gradient(120deg,var(--pink),var(--violet));
    box-shadow:0 12px 30px -12px var(--shadow-color);
  }
  .btn-main:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
  .btn-ghost:hover{background:rgba(255,255,255,.13);border-color:var(--muted)}
  .btn-danger{background:rgba(244,63,94,.15);color:#ff8ba0;border:1px solid rgba(244,63,94,.35)}
  .btn-danger:hover{background:rgba(244,63,94,.26)}
  .btn-mini{
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    padding:0 18px;border-radius:12px;border:none;color:#fff;
    background:linear-gradient(120deg,var(--pink),var(--violet));transition:.2s;
  }
  .btn-mini:hover{filter:brightness(1.12)}

  .stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;font-size:12px;color:var(--muted)}
  .stats span{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--border)}
  .stats b{color:var(--pink);font-weight:700}

  .filters{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    border:1px solid var(--border);background:var(--card);
    color:var(--text);padding:7px 14px;border-radius:999px;font-size:13px;
    font-family:inherit;cursor:pointer;transition:.2s;white-space:nowrap;
  }
  .chip:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
  .chip.active{
    background:linear-gradient(135deg,var(--pink),var(--violet));border-color:transparent;
    color:#fff;font-weight:600;box-shadow:0 8px 22px -8px var(--shadow-color);
  }
  .sort{
    align-self:flex-start;font-family:inherit;font-size:13px;color:var(--text);
    background:var(--card);border:1px solid var(--border);
    padding:7px 12px;border-radius:999px;outline:none;cursor:pointer;
  }
  .sort option{background:var(--bg);color:var(--text)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .empty{
    grid-column:1/-1;text-align:center;padding:60px 20px;
    color:var(--muted);font-size:15px;line-height:1.7;
  }

  .card{
    position:relative;display:flex;flex-direction:column;gap:8px;
    padding:16px 16px 12px 18px;border-radius:16px;
    border:1px solid var(--border);background:var(--card);
    cursor:pointer;overflow:hidden;
    transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--c,var(--violet));opacity:.9;
  }
  .card:hover{
    transform:translateY(-3px);border-color:var(--pink);
    box-shadow:0 16px 34px -18px var(--shadow-color);
  }
  .card-top{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .cat-badge{
    font-size:10px;font-weight:700;letter-spacing:.4px;
    padding:3px 8px;border-radius:7px;
    color:var(--c,var(--violet));
    background:rgba(200,200,200,.1);
    border:1px solid rgba(200,200,200,.15);
  }
  .st-badge{font-size:10px;padding:3px 8px;border-radius:7px;background:rgba(128,128,128,.15);color:var(--text)}
  .st-badge.st-progress{color:#7dd3fc;background:rgba(56,189,248,.14)}
  .st-badge.st-done{color:#86efac;background:rgba(74,222,128,.14)}
  .card-title{
    font-size:16px;font-weight:700;line-height:1.3;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-year{font-size:12px;color:var(--muted);letter-spacing:.3px;margin-top:-4px}
  .card-stars{display:flex;gap:1px;margin-top:auto}
  .card-foot{
    display:flex;align-items:center;gap:10px;
    font-size:12px;color:var(--muted);padding-top:8px;
    border-top:1px solid var(--border);
  }

  .star{
    background:none;border:none;padding:0 1.5px;cursor:pointer;line-height:1;
    color:rgba(128,128,128,.3);font-family:inherit;transition:.15s;
  }
  .star:hover{transform:scale(1.18)}
  .star.on{color:var(--gold);text-shadow:0 0 12px var(--shadow-color)}

  .modal{
    position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(0,0,0,.7);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity .28s ease;
  }
  .modal.show{opacity:1;pointer-events:auto}
  .modal-box{
    width:100%;max-width:500px;max-height:90vh;overflow-y:auto;
    padding:24px;border-radius:22px;
    border:1px solid var(--border);
    background:var(--bg);
    box-shadow:0 40px 90px -25px #000,0 0 70px -20px var(--shadow-color);
    transform:translateY(16px) scale(.97);
    transition:transform .32s cubic-bezier(.2,1.15,.4,1);
  }
  .modal.show .modal-box{transform:translateY(0) scale(1)}
  .modal-box::-webkit-scrollbar{width:6px}
  .modal-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

  .d-top{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .d-year{font-size:12px;color:var(--muted)}
  .d-title{font-size:22px;font-weight:800;line-height:1.25;margin-bottom:18px;color:var(--text)}

  .d-block{margin-bottom:18px}
  .d-label{
    font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;font-weight:600;
  }
  .d-label b{color:var(--gold);letter-spacing:0;font-size:12px}
  .muted{color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px;font-weight:400}
  .small{font-size:13px;line-height:1.6}

  .status-row{display:flex;gap:6px;flex-wrap:wrap}
  .st-btn{
    font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
    padding:8px 14px;border-radius:10px;transition:.2s;
    background:var(--card);border:1px solid var(--border);color:var(--text);
  }
  .st-btn:hover{background:rgba(128,128,128,.2)}
  .st-btn.active{
    background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;border-color:transparent;
    box-shadow:0 8px 20px -8px var(--shadow-color);
  }

  .big-stars{display:flex;gap:4px}
  .big-stars .star{padding:0 2px}

  .note-box{
    font-size:13px;line-height:1.6;color:var(--text);
    background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;
  }

  .comment-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .comment{
    background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:10px 12px;
  }
  .comment-text{font-size:13px;line-height:1.5;color:var(--text);word-break:break-word;white-space:pre-wrap}
  .comment-meta{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-top:6px;font-size:11px;color:var(--muted);
  }
  .comment-del{
    background:none;border:none;color:var(--muted);font-family:inherit;
    font-size:11px;cursor:pointer;padding:2px 6px;border-radius:6px;transition:.2s;
  }
  .comment-del:hover{color:#ff8ba0;background:rgba(244,63,94,.12)}

  .comment-form{display:flex;gap:6px}
  .comment-form input{
    flex:1;font-family:inherit;font-size:13px;color:var(--text);
    background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;outline:none;transition:.2s;min-width:0;
  }
  .comment-form input::placeholder{color:var(--muted)}
  .comment-form input:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--shadow-color)}

  .d-actions{display:flex;gap:8px;padding-top:14px;border-top:1px solid var(--border)}
  .d-actions .btn{flex:1;padding:10px 12px;font-size:13px}

  .form-box h2{font-size:18px;font-weight:800;margin-bottom:18px;color:var(--text)}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:12px;color:var(--muted);letter-spacing:.3px}
  .field input,.field select,.field textarea{
    font-family:inherit;font-size:14px;color:var(--text);width:100%;
    background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;outline:none;transition:.2s;
  }
  .field textarea{resize:vertical;min-height:70px;line-height:1.5}
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:var(--pink);background:var(--card);
    box-shadow:0 0 0 3px var(--shadow-color);
  }
  .field select option{background:var(--bg);color:var(--text)}
  .form-row{display:grid;grid-template-columns:1fr 110px;gap:10px}
  .form-actions{display:flex;gap:8px;margin-top:18px}
  .form-actions .btn{flex:1}

  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:16px; }
  .theme-item {
    padding:12px; border-radius:10px; border:2px solid var(--border);
    cursor: pointer; text-align: center; font-weight: 600; font-size:13px; transition: .2s;
    background: var(--card); color: var(--text);
  }
  .theme-item:hover { border-color: var(--pink); transform: translateY(-2px); }
  .theme-item.active { border-color: var(--pink); box-shadow: 0 0 15px var(--shadow-color); }

  .toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 20px;
    background: linear-gradient(120deg, var(--pink), var(--violet)); 
    color: white; padding: 11px 20px; border-radius: 10px;
    font-weight: 600; font-size: 13px;
    box-shadow: 0 10px 30px var(--shadow-color);
    transform: translateY(100px); opacity: 0;
    transition: transform 0.3s cubic-bezier(0.2, 1.2, 0.4, 1), opacity 0.3s;
    z-index: 1000; pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  @media(max-width:560px){
    body{padding: calc(18px + env(safe-area-inset-top, 0px)) 12px calc(60px + env(safe-area-inset-bottom, 0px))}
    .grid{grid-template-columns:1fr}
    .top-actions{min-width:100%;justify-content:stretch}
    .search{max-width:none}
    .btn-main{padding:12px 14px; font-size:13px;}
    .modal-box{padding:20px}
    .form-row{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>Мой список <span>✦</span></h1>
      <p class="sub">Фильмы, сериалы, игры и книги</p>
    </div>
    <div class="top-actions">
      <div class="search">
        <span>🔍</span>
        <input id="search" placeholder="Поиск..." autocomplete="off">
      </div>
      <button class="btn btn-ghost" id="importTxtBtn" title="Импорт из TXT">📥 TXT</button>
      <button class="btn btn-ghost" id="settingsBtn">⚙️</button>
      <button class="btn btn-main" id="addBtn">+ Добавить</button>
      
      <input type="file" id="importFile" accept=".txt" style="display:none;">
      <input type="file" id="importJsonFile" accept=".json" style="display:none;">
    </div>
  </header>

  <div class="stats">
    <span>Всего: <b id="statTotal">0</b></span>
    <span>🕐 В планах: <b id="statPlan">0</b></span>
    <span>▶️ В процессе: <b id="statProgress">0</b></span>
    <span>✅ Готово: <b id="statDone">0</b></span>
    <span>⭐ Средняя: <b id="statAvg">—</b></span>
  </div>

  <div class="filters">
    <div class="chips" id="catChips"></div>
    <div class="chips" id="statusChips"></div>
    <select id="sortSel" class="sort">
      <option value="added">Сначала новые</option>
      <option value="title">По названию</option>
      <option value="rating">По оценке</option>
      <option value="year">По году</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="detailModal"><div class="modal-box" id="detailBody"></div></div>

<div class="modal" id="formModal">
  <div class="modal-box form-box">
    <h2 id="formTitle">Новое произведение</h2>
    <form id="itemForm">
      <div class="field">
        <label>Название *</label>
        <input name="title" maxlength="140" required placeholder="Например: Интерстеллар">
      </div>
      <div class="form-row">
        <div class="field">
          <label>Категория</label>
          <select name="category" id="catSelect"></select>
        </div>
        <div class="field">
          <label>Год</label>
          <input name="year" type="number" min="1800" max="2100" placeholder="—">
        </div>
      </div>
      <div class="field">
        <label>Заметка / описание</label>
        <textarea name="note" maxlength="800" placeholder="Почему хочется посмотреть..."></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="formCancel">Отмена</button>
        <button type="submit" class="btn btn-main">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-box form-box">
    <h2>Настройки</h2>
    <div class="d-label" style="margin-top:6px;">Тема</div>
    <div class="theme-grid" id="themeGrid"></div>

    <div class="d-label" style="margin-top:16px;">Данные</div>
    <p class="sub" style="margin-bottom:12px; font-size:11px; line-height:1.4;">
      Данные хранятся в браузере. Скачайте резервную копию — она не потеряется при очистке кэша.
    </p>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <button type="button" class="btn btn-main" id="saveHtmlBtn">💾 Скачать HTML с данными</button>
      <button type="button" class="btn btn-ghost" id="exportJsonBtn">📦 Скачать JSON</button>
      <button type="button" class="btn btn-ghost" id="importJsonBtn">📂 Загрузить JSON</button>
      <button type="button" class="btn btn-ghost" id="resetDataBtn" style="color: #ff8ba0; border-color: rgba(244,63,94,.35); margin-top: 6px;">🗑 Сбросить всё</button>
    </div>
    <div class="form-actions" style="margin-top: 16px;">
      <button type="button" class="btn btn-ghost" id="settingsClose">Закрыть</button>
    </div>
  </div>
</div>

<div id="toast" class="toast">✅ Сохранено</div>

<script>
/* =========================================================
   TELEGRAM INIT
   ========================================================= */
const tg = window.Telegram?.WebApp;
if (tg) {
  try {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#0b0714');
    tg.setBackgroundColor('#0b0714');
    tg.enableClosingConfirmation();
    // Слушаем изменение viewport (важно для мобильных)
    tg.onEvent('viewportChanged', () => {
      document.documentElement.style.setProperty(
        '--tg-viewport-stable-height', tg.viewportStableHeight + 'px'
      );
    });
    document.documentElement.style.setProperty(
      '--tg-viewport-stable-height', tg.viewportStableHeight + 'px'
    );
  } catch(e) { console.warn('Telegram init error', e); }
}

// Универсальные alert/confirm
function showAlert(msg) {
  if (tg?.showAlert) tg.showAlert(String(msg));
  else alert(msg);
}
function showConfirm(msg) {
  if (tg?.showConfirm) return new Promise(r => tg.showConfirm(String(msg), r));
  return Promise.resolve(confirm(msg));
}

/* =========================================================
   1. КАТЕГОРИИ, СТАТУСЫ, ТЕМЫ, ИСХОДНЫЕ ДАННЫЕ
   ========================================================= */
const CATS = {
  игра:   {label:'Игры',    emoji:'🎮', color:'#7dd3fc'},
  фильм:  {label:'Фильмы',  emoji:'🎬', color:'#ff9acb'},
  сериал: {label:'Сериалы', emoji:'📺', color:'#a78bfa'},
  дорама: {label:'Дорамы',  emoji:'🌸', color:'#fda4af'},
  аниме:  {label:'Аниме',   emoji:'🍥', color:'#fcd34d'},
  книга:  {label:'Книги',   emoji:'📖', color:'#86efac'},
  другое: {label:'Другое',  emoji:'✨', color:'#c4b5fd'}
};
const STATUSES = {
  plan:     {label:'В планах',   emoji:'🕐'},
  progress: {label:'В процессе', emoji:'▶️'},
  done:     {label:'Готово',     emoji:'✅'}
};

const THEMES = {
  default: {
    name: 'Тёмная',
    vars: {
      '--bg': '#0b0714', 
      '--bg-img': 'radial-gradient(1100px 600px at 8% -10%, rgba(120,50,180,.42), transparent 70%), radial-gradient(900px 520px at 102% 0%, rgba(200,50,120,.32), transparent 70%), radial-gradient(900px 700px at 50% 125%, rgba(30,60,160,.3), transparent 70%)',
      '--card': 'rgba(255,255,255,.055)', '--border': 'rgba(255,255,255,.1)',
      '--text': '#efe8ff', '--muted': '#a596c4',
      '--pink': '#ff5fa2', '--violet': '#a855f7', '--gold': '#ffd166',
      '--shadow-color': 'rgba(255,95,162,.85)'
    }
  },
  light: {
    name: 'Светлая ☀️',
    vars: {
      '--bg': '#f4effa', 
      '--bg-img': 'radial-gradient(1100px 600px at 8% -10%, rgba(200,150,255,.3), transparent 70%), radial-gradient(900px 520px at 102% 0%, rgba(255,100,150,.2), transparent 70%)',
      '--card': 'rgba(255,255,255,0.85)', '--border': 'rgba(0,0,0,.08)',
      '--text': '#1a1029', '--muted': '#665a7a',
      '--pink': '#d946ef', '--violet': '#8b5cf6', '--gold': '#eab308',
      '--shadow-color': 'rgba(139,92,246,.3)'
    }
  },
  cyberpunk: {
    name: 'Киберпанк ⚡',
    vars: {
      '--bg': '#050505', 
      '--bg-img': 'radial-gradient(1100px 600px at 8% -10%, rgba(0,255,255,.12), transparent 70%), radial-gradient(900px 520px at 102% 0%, rgba(255,255,0,.1), transparent 70%)',
      '--card': 'rgba(20,20,20,.85)', '--border': 'rgba(255,255,0,.25)',

/* =========================================================
   2. ХРАНИЛИЩЕ
   ========================================================= */
const LS_KEY = 'mywatchlist_v6';
const OLD_KEY = 'mywatchlist_v5';
const LS_THEME = 'mywatchlist_theme';

let items = [];
let ui = { cat:'все', status:'все', q:'', sort:'added', openId:null };
let editingId = null;

function save(){
  try{ 
    localStorage.setItem(LS_KEY, JSON.stringify({items})); 
    const toast = document.getElementById('toast');
    if (toast) {
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }
  }catch(e){ 
    if (e.name === 'QuotaExceededError') {
      showAlert('⚠️ Память браузера переполнена.\n\nСкачайте резервную копию в Настройках и удалите старые записи.');
    }
    console.error('Save failed', e); 
  }
}

function load(){
  const dataEl = document.getElementById('embedded-data');
  if (dataEl) {
    try {
      const parsed = JSON.parse(dataEl.textContent);
      if (parsed && Array.isArray(parsed.items)) {
        items = parsed.items;
        dataEl.remove();
        save();
        return;
      }
    } catch(e) { console.error('Failed to parse embedded data', e); }
  }

  try{
    let raw = localStorage.getItem(LS_KEY) || localStorage.getItem(OLD_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.items)) {
        items = parsed.items.map(it => ({
          ...it,
          comments: Array.isArray(it.comments) ? it.comments : [],
          rating: typeof it.rating === 'number' ? it.rating : 0,
          status: it.status || 'plan'
        }));
        return;
      }
    }
  }catch(e){ console.warn('load failed',e); }

  const now = Date.now();
  items = SEED.map((s,i)=>({
    id: 's' + i + '_' + Math.random().toString(36).slice(2,7),
    title: s[0],
    category: CATS[s[1]] ? s[1] : 'другое',
    year: s[2] || null,
    note: '',
    status: 'plan',
    rating: 0,
    comments: [],
    createdAt: now - (SEED.length - i) * 1000
  }));
  save();
}

/* =========================================================
   3. УТИЛИТЫ
   ========================================================= */
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function starsHTML(rating, size){
  const r = Number(rating) || 0;
  let out = '';
  for(let i=1;i<=5;i++){
    out += `<button type="button" class="star${i<=r?' on':''}" data-val="${i}"
              style="font-size:${size}px" aria-label="${i} из 5">★</button>`;
  }
  return out;
}

function nowLabel(){
  return new Date().toLocaleString('ru-RU',
    {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
}

function filtered(){
  let list = items.slice();
  if(ui.cat !== 'все')    list = list.filter(i => i.category === ui.cat);
  if(ui.status !== 'все') list = list.filter(i => i.status === ui.status);
  if(ui.q){
    const q = ui.q.toLowerCase();
    list = list.filter(i => (i.title + ' ' + (i.note||'')).toLowerCase().includes(q));
  }
  const sorters = {
    added:  (a,b) => b.createdAt - a.createdAt,
    title:  (a,b) => a.title.localeCompare(b.title,'ru'),
    rating: (a,b) => (b.rating - a.rating) || a.title.localeCompare(b.title,'ru'),
    year:   (a,b) => (b.year||0) - (a.year||0)
  };
  list.sort(sorters[ui.sort] || sorters.added);
  return list;
}

function cardHTML(it){
  const c  = CATS[it.category] || CATS.другое;
  const st = STATUSES[it.status] || STATUSES.plan;
  return `
  <article class="card" data-id="${esc(it.id)}" style="--c:${c.color}">
    <div class="card-top">
      <span class="cat-badge">${c.emoji} ${c.label}</span>
      <span class="st-badge st-${esc(it.status)}">${st.emoji} ${st.label}</span>
    </div>
    <h3 class="card-title">${esc(it.title)}</h3>
    ${it.year ? `<div class="card-year">${esc(it.year)}</div>` : ''}
    <div class="card-stars" data-stars="${esc(it.id)}">${starsHTML(it.rating, 17)}</div>
    <div class="card-foot">
      <span>💬 ${it.comments.length}</span>
      ${it.note ? '<span title="Есть заметка">📝</span>' : ''}
      <span style="margin-left:auto">${it.rating ? '⭐ ' + esc(it.rating) : ''}</span>
    </div>
  </article>`;
}

function render(){
  const list = filtered();
  gridEl.innerHTML = list.length
    ? list.map(cardHTML).join('')
    : `<div class="empty">😕 Ничего не нашлось.<br>Измените фильтры или добавьте что-нибудь новое.</div>`;

  document.getElementById('statTotal').textContent    = items.length;
  document.getElementById('statPlan').textContent     = items.filter(i=>i.status==='plan').length;
  document.getElementById('statProgress').textContent = items.filter(i=>i.status==='progress').length;
  document.getElementById('statDone').textContent     = items.filter(i=>i.status==='done').length;

  const rated = items.filter(i => i.rating > 0);
  document.getElementById('statAvg').textContent = rated.length
    ? (rated.reduce((s,i)=>s+i.rating,0) / rated.length).toFixed(1)
    : '—';
}

function openForm(id){
  editingId = id || null;
  const it = id ? items.find(x => x.id === id) : null;

  document.getElementById('formTitle').textContent =
    it ? 'Редактировать' : 'Новое произведение';

  const el = n => formEl.elements.namedItem(n);
  el('title').value    = it ? it.title : '';
  el('category').value = it ? it.category : 'фильм';
  el('year').value     = it && it.year ? it.year : '';
  el('note').value     = it ? (it.note || '') : '';

  formModal.classList.add('show');
  setTimeout(() => el('title').focus(), 90);
}
function closeForm(){
  formModal.classList.remove('show');
  editingId = null;
}

formEl.addEventListener('submit', e => {
  e.preventDefault();
  const el = n => formEl.elements.namedItem(n);

  const title = el('title').value.trim();
  if(!title) return;

  const yearRaw = parseInt(el('year').value, 10);
  const data = {
    title,
    category: el('category').value,
    year: isNaN(yearRaw) ? null : yearRaw,
    note: el('note').value.trim()
  };

  if(editingId){
    const it = items.find(x => x.id === editingId);
    if(it) Object.assign(it, data);
  } else {
    items.push({
      id: uid('u'),
      ...data,
      status: 'plan',
      rating: 0,
      comments: [],
      createdAt: Date.now()
    });
  }

  save();
  closeForm();
  render();
  if(ui.openId) renderDetail();
});

function getCleanHTML() {
  const gridHTML = gridEl.innerHTML;
  gridEl.innerHTML = '';
  
  const oldEmbedded = document.getElementById('embedded-data');
  if (oldEmbedded) oldEmbedded.remove();
  
  let htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  gridEl.innerHTML = gridHTML;
  
  const safeJSON = JSON.stringify({ items }).replace(/</g, '\\u003c');
  const scriptOpen = '<script id="embedded-data" type="application/json">';
  const scriptClose = '<\/script>';
  const dataScript = '\n' + scriptOpen + safeJSON + scriptClose + '\n';
  
  htmlContent = htmlContent.replace(/(<body[^>]*>)/i, function(match) {
    return match + '\n' + dataScript;
  });
  
  return htmlContent;
}

function downloadBlob(content, filename, mimeType) {
  const blob = new Blob([content], {type: mimeType});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  // Предупреждение для мобильных
  if (/Android|iPhone|iPad|iPod/.test(navigator.userAgent)) {
    setTimeout(() => {
      showAlert('💡 Если файл не скачался — нажмите ⋯ в правом верхнем углу Telegram и выберите "Открыть в браузере".');
    }, 300);
  }
}

document.getElementById('saveHtmlBtn').addEventListener('click', () => {
  closeDetail(); closeForm(); closeSettings();
  downloadBlob(getCleanHTML(), 'my_watchlist.html', 'text/html');
});

document.getElementById('importTxtBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    const text = evt.target.result;
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    
    if (lines.length === 0) {
      showAlert('Файл пуст.');
      return;
    }

    const now = Date.now();
    lines.forEach((title, index) => {
      items.push({
        id: uid('imp'),
        title: title,
        category: 'другое',
        year: null,
        note: '',
        status: 'plan',
        rating: 0,
        comments: [],
        createdAt: now + index
      });
    });

    save();
    render();
    showAlert(`Импортировано ${lines.length} записей.`);
    this.value = '';
  };
  reader.readAsText(file, 'UTF-8');
});

document.getElementById('exportJsonBtn').addEventListener('click', () => {
  downloadBlob(
    JSON.stringify({items}, null, 2),
    `my_watchlist_backup_${new Date().toISOString().slice(0,10)}.json`,
    'application/json'
  );
});

document.getElementById('importJsonBtn').addEventListener('click', () => {
  document.getElementById('importJsonFile').click();
});

document.getElementById('importJsonFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (Array.isArray(parsed.items)) {
        items = parsed.items.map(it => ({
          ...it,
          comments: Array.isArray(it.comments) ? it.comments : [],
          rating: Number(it.rating) || 0,
          status: it.status || 'plan'
        }));
        save();
        render();
        closeSettings();
        showAlert('База данных загружена!');
      } else {
        showAlert('Неверный формат файла.');
      }
    } catch (err) {
      showAlert('Ошибка чтения JSON.');
    }
    this.value = '';
  };
  reader.readAsText(file, 'UTF-8');
});

document.getElementById('resetDataBtn').addEventListener('click', async () => {
  const ok = await showConfirm('Удалить все изменения и вернуть исходный список?');
  if (ok) {
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem(OLD_KEY);
    location.reload();
  }
});

/* ---- Темы ---- */
function applyTheme(themeKey) {
  const theme = THEMES[themeKey] || THEMES['default'];
  const root = document.documentElement;
  for (const [key, value] of Object.entries(theme.vars)) {
    root.style.setProperty(key, value);
  }
  localStorage.setItem(LS_THEME, themeKey);
  document.querySelectorAll('.theme-item').forEach(el => {
    el.classList.toggle('active', el.dataset.theme === themeKey);
  });
}

function buildThemeUI() {
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = Object.entries(THEMES).map(([key, t]) => `
    <div class="theme-item" data-theme="${key}">${t.name}</div>
  `).join('');
  grid.addEventListener('click', (e) => {
    const item = e.target.closest('.theme-item');
    if (item) applyTheme(item.dataset.theme);
  });
}

function openSettings(){ settingsModal.classList.add('show'); }
function closeSettings(){ settingsModal.classList.remove('show'); }

/* =========================================================
   8. СОБЫТИЯ
   ========================================================= */
document.addEventListener('click', e => {
  const star = e.target.closest('.star');
  if(!star) return;
  e.preventDefault();
  const holder = star.closest('[data-stars]');
  if(!holder) return;
  const it = items.find(x => x.id === holder.dataset.stars);
  if(!it) return;
  const val = Number(star.dataset.val);
  it.rating = (it.rating === val) ? 0 : val;
  save();
  render();
  if(ui.openId === it.id) renderDetail();
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
});

gridEl.addEventListener('click', e => {
  if(e.target.closest('.star')) return;
  const card = e.target.closest('.card');
  if(card) openDetail(card.dataset.id);
});

document.getElementById('catChips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#catChips .chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  ui.cat = chip.dataset.cat;
  render();
});

document.getElementById('statusChips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#statusChips .chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  ui.status = chip.dataset.st;
  render();
});

document.getElementById('sortSel').addEventListener('change', e => {
  ui.sort = e.target.value;
  render();
});

document.getElementById('search').addEventListener('input', e => {
  ui.q = e.target.value.trim();
  render();
});

detailBody.addEventListener('click', e => {
  const statusBtn = e.target.closest('[data-status]');
  if(statusBtn){
    const it = items.find(x => x.id === ui.openId);
    if(it){
      it.status = statusBtn.dataset.status;
      save(); renderDetail(); render();
    }
    return;
  }

  const delComment = e.target.closest('[data-cdel]');
  if(delComment){
    const it = items.find(x => x.id === ui.openId);
    if(it){
      it.comments = it.comments.filter(c => c.id !== delComment.dataset.cdel);
      save(); renderDetail(); render();
    }
    return;
  }

  const editBtn = e.target.closest('[data-edit]');
  if(editBtn){ openForm(editBtn.dataset.edit); return; }

  const delBtn = e.target.closest('[data-del]');
  if(delBtn){
    const it = items.find(x => x.id === delBtn.dataset.del);
    if(it){
      showConfirm(`Удалить «${it.title}»?`).then(ok => {
        if (ok) {
          items = items.filter(x => x.id !== it.id);
          save(); closeDetail(); render();
        }
      });
    }
  }
});

detailBody.addEventListener('submit', e => {
  if(!e.target.matches('[data-cform]')) return;
  e.preventDefault();
  const input = e.target.querySelector('[data-cinput]');
  const text = input.value.trim();
  if(!text) return;
  const it = items.find(x => x.id === ui.openId);
  if(!it) return;
  it.comments.push({ id: uid('c'), text, date: nowLabel() });
  save();
  renderDetail();
  render();
  const again = detailBody.querySelector('[data-cinput]');
  if(again) again.focus();
});

document.getElementById('addBtn').addEventListener('click', () => openForm(null));
document.getElementById('formCancel').addEventListener('click', closeForm);
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsClose').addEventListener('click', closeSettings);

detailModal.addEventListener('click', e => { if(e.target === detailModal) closeDetail(); });
formModal.addEventListener('click',   e => { if(e.target === formModal)   closeForm();   });
settingsModal.addEventListener('click', e => { if(e.target === settingsModal) closeSettings(); });

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(settingsModal.classList.contains('show')) closeSettings();
  else if(formModal.classList.contains('show')) closeForm();
  else if(detailModal.classList.contains('show')) closeDetail();
});

window.addEventListener('storage', (e) => {
  if (e.key === LS_KEY) {
    load(); render();
    if (ui.openId) renderDetail();
  }
});

/* =========================================================
   9. СТАРТ
   ========================================================= */
load();
buildChips();
buildThemeUI();
const savedTheme = localStorage.getItem(LS_THEME) || 'default';
applyTheme(savedTheme);
render();
</script>
</body>
</html>
